<!DOCTYPE html>
<html>
<head>
<title>Flags - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #f5f5f5; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
.flag { width: 200px; height: 120px; margin: 10px auto; border-radius: 8px; }
.pak { background: green; position: relative; }
.uk { background: #012169; position: relative; color: white; display: flex; align-items: center; justify-content: center; font-size: 40px; }
button { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>My Two Flags 🇵🇰🇬🇧</h1>
<p>Project 37 - By Ismail</p>
<div class="flag pak"><span style="font-size:50px; color:white;">☪️</span></div>
<p>Pakistan - Jhelum</p>
<div class="flag uk">🇬🇧</div>
<p>UK - Leeds - 2030 Mein!</p>
<button onclick="show()">My Dream</button>
<h2 id="m"></h2>
</div>
<script>
function show(){
document.getElementById("m").innerText = "Jhelum Se Leeds Tak! InshaAllah!";
}
</script>
</body>
</html>

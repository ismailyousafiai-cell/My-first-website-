<!DOCTYPE html>
<html>
<head>
<title>My Calculator - ICS Project</title>
<style>
body { text-align: center; font-family: Arial; margin-top: 50px; }
input { padding: 10px; margin: 5px; font-size: 18px; }
button { padding: 10px 20px; font-size: 18px; background: black; color: white; }
</style>
</head>
<body>
<h1>Calculator - Made by Me (ICS)</h1>
<input type="number" id="num1" placeholder="Pehla Number">
<input type="number" id="num2" placeholder="Dusra Number">
<br>
<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">*</button>
<button onclick="calc('/')">/</button>
<h2 id="result">Result: </h2>

<script>
function calc(op){
let a = parseFloat(document.getElementById'num1'.value);
let b = parseFloat(document.getElementById 'num2'.value);
let res;
if(op=='+') res=a+b;
if(op=='-') res=a-b;
if(op=='*') res=a*b;
if(op=='/') res=a/b;
document.getElementById('result').innerText = "Result: " + res;
}
</script>
</body>

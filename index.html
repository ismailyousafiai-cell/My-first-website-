<!DOCTYPE html>
<html>
<body>
<h1>Calculator - ICS</h1>
<input id=a type=number placeholder=Pehla>
<input id=b type=number placeholder=Dusra>
<br><br>
<button onclick="r.innerText= +a.value + +b.value">+</button>
<button onclick="r.innerText= a.value - b.value">-</button>
<button onclick="r.innerText= a.value * b.value">*</button>
<button onclick="r.innerText= a.value / b.value">/</button>
<h2 id=r>Result: </h2>
</body>
</html>

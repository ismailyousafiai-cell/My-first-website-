<!DOCTYPE html>
<html>
<head>
<title>Stopwatch - Ismail</title>
<style>
body { font-family: Arial; background: #212121; color: white; text-align: center; padding: 40px; }
.box { background: #333; padding: 30px; max-width: 380px; margin: auto; border-radius: 15px; }
h1 { font-size: 55px; color: #00ff00; margin: 10px; }
button { padding: 12px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 8px; cursor: pointer; }
.start { background: #4CAF50; color: white; }
.stop { background: #f44336; color: white; }
.reset { background: #ff9800; color: white; }
</style>
</head>
<body>
<div class="box">
<h2>Ismail's Stopwatch</h2>
<h1 id="time">00:00</h1>
<button class="start" onclick="start()">Start</button>
<button class="stop" onclick="stop()">Stop</button>
<button class="reset" onclick="reset()">Reset</button>
<p>Race ka time dekho!</p>
</div>

<script>
let sec = 0;
let timer = null;
function update(){
sec++;
let m = Math.floor(sec / 60);
let s = sec % 60;
if(m < 10) m = "0" + m;
if(s < 10) s = "0" + s;
document.getElementById("time").innerText = m + ":" + s;
}
function start(){
if(timer == null){
timer = setInterval(update, 1000);
}
}
function stop(){
clearInterval(timer);
timer = null;
}
function reset(){
clearInterval(timer);
timer = null;
sec = 0;
document.getElementById("time").innerText = "00:00";
}
</script>
</body>
</html>

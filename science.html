<!DOCTYPE html>
<html>
<head>
<title>Science Quiz - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e8f5e9; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 10px 20px; margin: 5px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Science Quiz 🧪</h1>
<p>Project 35 - By Ismail - Matric Ke Liye!</p>
<p id="q">Pani ka formula kya hai?</p>
<button onclick="check('H2O')">H2O</button>
<button onclick="check('CO2')">CO2</button>
<button onclick="check('O2')">O2</button>
<h2 id="r"></h2>
</div>
<script>
function check(ans){
if(ans === "H2O") document.getElementById("r").innerText = "Sahi Hai! 🎉";
else document.getElementById("r").innerText = "Galat Hai! Dobara Try Karo!";
}
</script>
</body>
</html>

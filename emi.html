<!DOCTYPE html>
<html>
<head>
<title>【entity-BMW¦canonical_name=BMW】 EMI - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #212121; color: white; padding: 30px; }
.box { background: #333; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; margin: 5px; font-size: 16px; }
button { padding: 12px 25px; background: #fff; color: black; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
<h1>【entity-BMW¦canonical_name=BMW】 M5 EMI Calculator</h1>
<p>Project 31 - Matte Black!</p>
<p>Car Price (£):</p>
<input type="number" id="price" placeholder="40000">
<p>Mahine Kitne? (60)</p>
<input type="number" id="months" placeholder="60">
<br><br>
<button onclick="calc()">EMI Dekho</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let p = Number(document.getElementById("price").value);
let m = Number(document.getElementById("months").value);
if(!p || !m) return;
let emi = (p / m).toFixed(0);
document.getElementById("r").innerText = "Har Mahine: £" + emi;
}
</script>
</body>
</html>

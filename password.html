<!DOCTYPE html>
<html>
<head>
<title>Password Generator - Ismail</title>
<style>
body { font-family: Arial; background: #e0f7ff; text-align: center; padding: 40px; }
.box { background: white; padding: 30px; max-width: 380px; margin: auto; border-radius: 15px; }
h2 { color: #007bff; }
#pass { font-size: 22px; background: #eee; padding: 12px; border-radius: 8px; margin: 15px 0; word-break: break-all; }
button { background: #007bff; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; }
button:hover { background: #0056b3; }
</style>
</head>
<body>
<div class="box">
<h2>Ismail's Password Generator</h2>
<p>Strong Password Banao!</p>
<div id="pass">Click Generate!</div>
<button onclick="makePass()">Generate Password</button>
<button onclick="copyPass()">Copy</button>
<p id="msg"></p>
</div>

<script>
function makePass(){
let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
let password = "";
for(let i=0; i<12; i++){
password += chars[Math.floor(Math.random() * chars.length)];
}
document.getElementById("pass").innerText = password;
document.getElementById("msg").innerText = "";
}
function copyPass(){
let text = document.getElementById("pass").innerText;
navigator.clipboard.writeText(text);
document.getElementById("msg").innerText = "Copied! ✅";
}
</script>
</body>
</html>

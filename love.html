<!DOCTYPE html>
<html>
<head>
<title>Love Calculator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #fce4ec; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; margin: 5px; font-size: 16px; }
button { padding: 12px 25px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Love Calculator ❤️</h1>
<p>Project 29 - By Ismail - Just For Fun!</p>
<input type="text" id="n1" placeholder="Tumhara Naam">
<input type="text" id="n2" placeholder="Uska Naam">
<br><br>
<button onclick="calc()">Check Karo</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let n1 = document.getElementById("n1").value;
let n2 = document.getElementById("n2").value;
if(!n1 || !n2){ document.getElementById("r").innerText = "Naam Likho!"; return; }
let p = Math.floor(Math.random()*101);
document.getElementById("r").innerText = n1 + " + " + n2 + " = " + p + "% Love!";
}
</script>
</body>
</html>

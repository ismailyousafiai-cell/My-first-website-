<!DOCTYPE html>
<html>
<head>
<title>Calculator - Ismail</title>
<style>
body { font-family: Arial; background: #f0f0f0; text-align: center; padding: 30px; }
.box { background: white; padding: 20px; max-width: 300px; margin: auto; border-radius: 10px; }
input { width: 90%; padding: 10px; margin: 5px; font-size: 18px; }
button { width: 60px; padding: 10px; margin: 5px; font-size: 18px; background: blue; color: white; border: none; cursor: pointer; }
h2 { color: blue; }
</style>
</head>
<body>
<div class="box">
<h2>Ismail's Calculator</h2>
<input type="number" id="num1" placeholder="First Number">
<input type="number" id="num2" placeholder="Second Number">
<br>
<button onclick="calc('+')">+</button>
<button onclick="calc('-')">-</button>
<button onclick="calc('*')">x</button>
<button onclick="calc('/')">/</button>
<h2 id="result">Result: 0</h2>
</div>

<script>
function calc(op){
let a = Number(document.getElementById("num1").value);
let b = Number(document.getElementById("num2").value);
let res = 0;
if(op == '+') res = a + b;
if(op == '-') res = a - b;
if(op == '*') res = a * b;
if(op == '/') res = a / b;
document.getElementById("result").innerText = "Result: " + res;
}
</script>
</body>
</html>

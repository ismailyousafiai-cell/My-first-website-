<!DOCTYPE html>
<html>
<head>
<title>Notes App - Ismail</title>
<style>
body { font-family: Arial; background: #fff9c4; text-align: center; padding: 30px; }
.box { background: white; padding: 25px; max-width: 400px; margin: auto; border-radius: 15px; }
input { padding: 12px; width: 85%; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; }
button { background: #fbc02d; color: black; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
ul { list-style: none; padding: 0; text-align: left; }
li { background: #fff59d; padding: 12px; margin: 8px 0; border-radius: 8px; }
li button { background: red; color: white; padding: 5px 10px; float: right; margin: 0; }
</style>
</head>
<body>
<div class="box">
<h2>Ismail's Notes App</h2>
<p>Apna Note Likho:</p>
<input type="text" id="note" placeholder="Example: Kal Python seekhna hai">
<br>
<button onclick="addNote()">Add Note</button>
<ul id="list"></ul>
</div>

<script>
function addNote(){
let n = document.getElementById("note").value;
if(!n){
alert("Pehle kuch likho!");
return;
}
let li = document.createElement("li");
li.innerHTML = n + ' <button onclick="this.parentElement.remove()">X</button>';
document.getElementById("list").appendChild(li);
document.getElementById("note").value = "";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Daily Quote - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #f3e5f5; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 25px; background: #8e24aa; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Daily Quote 💡</h1>
<p>Project 46 - By Ismail</p>
<button onclick="newQuote()">Naya Quote</button>
<h2 id="q">Mehnat Karo, UK Jao!</h2>
</div>
<script>
let quotes = ["Mehnat Karo, UK Jao!", "50 Projects = BJSS Job!", "Wembley Road Pe Apna Ghar Hoga!", "BMW M5 Matte Black - 2036 Mein!", "Matric Mein 850 Lane Hain!"];
function newQuote(){
let r = quotes[Math.floor(Math.random()*quotes.length)];
document.getElementById("q").innerText = r;
}
</script>
</body>
</html>
